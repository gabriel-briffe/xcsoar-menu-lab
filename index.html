<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>XCSoar menu lab</title>
  <style>
    :root {
      --bg: #0b0d10; --panel: #14171c; --tile: #23282f; --tile-hi: #2e353e;
      --line: #3a414b; --text: #f3f4f6; --muted: #9aa3ad; --gold: #f0c040;
      --accent: #6ea8ff; --ok: #8fbf4a; --safe: env(safe-area-inset-top, 8px);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text);
      font: 14px/1.35 "Segoe UI", "Helvetica Neue", sans-serif; }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { appearance: none; }
    .split {
      display: flex; justify-content: center; align-items: center;
      padding: 28px 16px 20px;
      margin-top: 8px;
      border-top: 1px solid var(--line);
    }
    .split .btn { min-height: 44px; padding: 0 18px; font-size: 15px; }
    #explorer { display: none; flex-direction: column; }
    body.tree-on #explorer { display: flex; }
    .toast {
      display: none; margin: 0; padding: 8px 12px; font-size: 12px;
      background: #2a3a24; color: #c9e38a; border-bottom: 1px solid var(--line);
    }
    .toast.show { display: block; }
    .io {
      display: none; padding: 10px; border-bottom: 1px solid var(--line); background: #101318;
    }
    .io.show { display: block; }
    .io textarea { width: 100%; min-height: 120px; background: #0b0d10; border: 1px solid var(--line);
      border-radius: 8px; padding: 8px; color: var(--text); font: 11px/1.35 ui-monospace, monospace; }
    .btn {
      border: 1px solid var(--line); background: var(--tile);
      border-radius: 9px; min-height: 36px; padding: 0 10px; font-weight: 650;
    }
    .btn:active { background: var(--tile-hi); }
    .btn.gold { border-color: #c9a227; color: #ffe08a; background: #3d3314; }
    .wrap { display: grid; grid-template-columns: 1fr; }
    @media (min-width: 980px) {
      body.tree-on .wrap { grid-template-columns: minmax(340px, 1fr) minmax(380px, 1fr); min-height: 100vh; }
      body.tree-on .explorer { border-left: 1px solid var(--line); }
    }

    /* emulator */
    .emu { background: #5c636c; min-height: 52vh; display: flex; flex-direction: column; }
    .emu-head {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; border-bottom: 1px solid #6e7680; background: #6a727c;
    }
    .emu-head h2 { flex: 1; margin: 0; font-size: 15px; }
    .crumb { color: var(--muted); font-size: 12px; padding: 8px 12px 0; }
    .tile.arrow {
      background: transparent; border: 0; box-shadow: none;
      color: var(--muted); font-size: 36px; font-weight: 400; line-height: 1;
    }
    .tile.arrow:active { background: transparent; color: var(--gold); }
    .section { color: var(--muted); font-size: 11px; letter-spacing: .06em;
      text-transform: uppercase; padding: 12px 12px 0; }
    .grid {
      display: grid; grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 8px; padding: 10px 12px 16px; align-content: start;
    }
    .tile {
      background: var(--tile); border: 1px solid var(--line); border-radius: 14px;
      height: 104px; max-height: 104px; padding: 6px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; text-align: center; overflow: hidden; width: 100%;
    }
    .tile:active { background: var(--tile-hi); }
    .tile svg { width: 32px; height: 32px; flex: 0 0 32px; }
    .tile .label { font-weight: 650; font-size: 12px; line-height: 1.15; max-height: 2.3em; overflow: hidden; }
    .tile .state { font-size: 11px; color: var(--gold); min-height: 13px; }

    /* explorer */
    .explorer { background: var(--panel); min-height: 48vh; }
    .ex-tools {
      position: sticky; top: 0; z-index: 30;
      display: flex; flex-wrap: wrap; gap: 6px;
      padding: calc(var(--safe) + 8px) 10px 8px;
      border-bottom: 1px solid var(--line);
      background: #14171c;
      box-shadow: 0 8px 16px rgba(0,0,0,.35);
    }
    .tree { flex: 1; overflow: visible; padding: 6px 0 12px; }
    .row {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 10px; border-left: 3px solid transparent; cursor: pointer;
    }
    .row:hover { background: #1c2128; }
    .row.sel { background: #243044; border-left-color: var(--accent); }
    .row.drop { background: #2a3a24; }
    .row .twist { width: 18px; text-align: center; color: var(--muted); }
    .row .ic { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; }
    .row .ic svg { width: 18px; height: 18px; }
    .row .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .tag { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .insp {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
      border-top: 1px solid var(--line);
      background: #101318;
      box-shadow: 0 -8px 20px rgba(0,0,0,.4);
      padding-bottom: env(safe-area-inset-bottom, 8px);
    }
    .insp-handle {
      display: flex; align-items: center; gap: 8px;
      width: 100%; padding: 10px 12px; background: #101318; border: 0; text-align: left;
    }
    .insp-handle .chev { color: var(--muted); width: 20px; }
    .insp-handle .preview { width: 28px; height: 28px; }
    .insp-handle .preview svg { width: 20px; height: 20px; }
    .insp-body { display: none; padding: 0 12px 12px; gap: 8px; max-height: 46vh; overflow: auto; }
    .insp.open .insp-body { display: grid; }
    .insp label { display: grid; gap: 4px; font-size: 11px; color: var(--muted); }
    .tree { padding-bottom: 72px; }
    @media (min-width: 980px) {
      .insp { left: auto; width: min(50vw, 100%); }
      .explorer { max-height: calc(100vh - 52px); overflow: auto; }
      .insp { position: sticky; width: auto; }
      .tree { padding-bottom: 16px; }
    }
    .insp input, .insp textarea, .insp select {
      background: #0b0d10; border: 1px solid var(--line); border-radius: 8px;
      padding: 8px; color: var(--text); width: 100%;
    }
    .insp textarea { min-height: 90px; font: 11px/1.35 ui-monospace, monospace; }
    .preview { width: 48px; height: 48px; background: var(--tile); border-radius: 10px;
      display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); }
    .preview svg { width: 32px; height: 32px; }
    .hint { color: var(--muted); font-size: 11px; padding: 0 10px 10px; }
    .cut { outline: 1px dashed var(--gold); }
  </style>
</head>
<body>
  <div id="toast" class="toast"></div>
  <div class="wrap">
    <section class="emu" id="emu"></section>
  </div>
  <div class="split">
    <button class="btn gold" type="button" id="btn-tree" onclick="toggleTree()">Reorganize</button>
  </div>
  <section class="explorer" id="explorer">
      <div class="ex-tools" id="ex-tools">
        <button class="btn" type="button" id="btn-reset">Reset</button>
        <button class="btn" type="button" id="btn-export">Export file</button>
        <label class="btn" for="imp" id="btn-import" style="display:inline-flex;align-items:center;cursor:pointer">Import file</label>
        <button class="btn" type="button" onclick="addNode()">+ Node</button>
        <button class="btn" type="button" onclick="moveSel(-1)">Up</button>
        <button class="btn" type="button" onclick="moveSel(1)">Down</button>
        <button class="btn" type="button" onclick="cutSel()">Cut</button>
        <button class="btn gold" type="button" onclick="pasteSel()">Paste</button>
        <button class="btn" type="button" onclick="pasteAsRoom()">Paste to root</button>
        <button class="btn" type="button" onclick="delSel()">Delete</button>
        <button class="btn" type="button" onclick="foldAll(false)">Fold all</button>
        <button class="btn" type="button" onclick="foldAll(true)">Unfold all</button>
      </div>
      <input id="imp" type="file" accept="application/json,.json,text/plain" hidden>
      <div class="hint">Everything is a node. Nest as deep as you want. Cut + Paste puts the node under the selection. Paste to root puts it on layer 1.</div>
      <div class="tree" id="tree"></div>
      <div class="insp" id="insp"></div>
    </section>

const KEY = "xcsoar-menu-lab-v6";

function allRoots() { return tree.pins.concat(tree.rooms); }

    if (inner) return inner;

}
function find(id) {

    const inner = findIn(n, id);

  }
  for (const n of tree.rooms) {

    const inner = findIn(n, id);

function renderTree() {

function rowHtml(n, depth) {
  const has = n.children && n.children.length;
  const opened = openSet.has(n.id);

    ? `<span class="twist" onclick="event.stopPropagation(); toggleOpen('${n.id}')">${opened ? "▾" : "▸"}</span>`
    : `<span class="twist"></span>`;
  const kids = (has && opened)
    ? n.children.map((c) => rowHtml(c, depth + 1)).join("")
    : "";
  return `<div class="row ${sel === n.id ? "sel" : ""} ${clip && clip.id === n.id ? "cut" : ""}"
      style="padding-left:${10 + depth * 16}px"

function nodeByPath() {
  let list = tree.rooms;
  let cur = { title: "Settings", children: list };
  const titles = ["Settings"];
  for (const id of emuPath) {
    const found = (cur.children || []).find((c) => c.id === id);
    if (!found) return { cur, titles, broken: true };
    cur = found;
    titles.push(found.title);
  }
  return { cur, titles, broken: false };
}
const PAGE = 9;
let emuPage = 0;
function renderEmu() {
  const el = document.getElementById("emu");
  const { cur, titles, broken } = nodeByPath();
  if (broken) { emuPath = []; emuPage = 0; return renderEmu(); }
  const kids = cur.children || [];
  const multi = kids.length > 9;
  const cells = [];
  if (!multi) {
    kids.forEach((c) => cells.push(tileHtml(c)));
  } else {
    let start = 0;
    for (let p = 0; p < emuPage; p++) {
      const hasPrev = p > 0;
      const left = kids.length - start;
      const take = 9 - (hasPrev ? 1 : 0) - 1;
      start += Math.max(1, take);
    }
    const hasPrev = emuPage > 0;
    const left = kids.length - start;
    const room = 9 - (hasPrev ? 1 : 0);
    const needNext = left > room - (left > room - 1 && room === 9 ? 0 : 0);
    // if remaining items fit in room, no next; if they need a next slot, take room-1
    const take = left > room ? room - 1 : left;
    const slice = kids.slice(start, start + take);
    const hasNext = start + take < kids.length;
    if (hasPrev) cells.push(`<button class="tile arrow" type="button" onclick="emuFlip(-1)">‹</button>`);
    slice.forEach((c) => cells.push(tileHtml(c)));
    if (hasNext) cells.push(`<button class="tile arrow" type="button" onclick="emuFlip(1)">›</button>`);
  }
  const back = emuPath.length ? "emuBack()" : "";
  el.innerHTML = head(cur.title || "Settings", back) +
    `<div class="crumb">${titles.map(esc).join(" / ")}</div>
     <div class="grid">${cells.join("") || empty()}</div>`;
}

function head(title, back) {
  return `<div class="emu-head">
    ${back ? `<button class="btn" type="button" onclick="${back}">Back</button>` : ""}
    <h2>${esc(title)}</h2>

}
function emuFlip(dir) {

}
function empty() { return `<div class="hint">Empty. Add children in the tree.</div>`; }
function tileHtml(n) {
  const hasKids = n.children && n.children.length;
  const click = hasKids ? `onclick="openEmu('${n.id}')"` : "";
  const cap = n.state || "";
  return `<button class="tile" type="button" ${click}>
    ${iconDraw(n)}
    <div class="label">${esc(n.title)}</div>
    ${cap ? `<div class="state">${esc(cap)}</div>` : ""}
  </button>`;
}

function openEmu(id) {
  const at = (nodeByPath().cur.children || []).some((c) => c.id === id);
  if (at) emuPath = emuPath.concat(id);

}
function emuBack() { emuPath = emuPath.slice(0, -1); emuPage = 0; renderEmu(); }

function selectNode(id) { sel = id; renderTree(); renderInsp(); }
function toggleInsp() { inspOpen = !inspOpen; renderInsp(); }

function addNode() {
  const fresh = node("node", "New node", "gear", "");
  const hit = sel && sel !== "__root__" ? find(sel) : null;
  if (!hit) {
    tree.rooms.push(fresh);
  } else {
    hit.n.children = hit.n.children || [];
    hit.n.children.push(fresh);
    openSet.add(hit.n.id);
  }
  sel = fresh.id;

function delSel() {
  if (!sel) return;
  const hit = find(sel);
  if (!hit) return;
  if (!armedDelete) {
    armedDelete = true;
    say("Tap Delete again to remove “" + hit.n.title + "”");
    setTimeout(() => { armedDelete = false; }, 2500);
    return;
  }
  armedDelete = false;
  const i = hit.sib.indexOf(hit.n);
  hit.sib.splice(i, 1);
  if (clip && clip.id === sel) clip = null;
  if (emuPath.includes(sel)) emuPath = [];
  sel = hit.p ? hit.p.id : null;
  renderAll();
}

function moveSel(dir) {
  if (!sel) { say("Select a node first"); return; }
  const hit = find(sel);
  if (!hit) return;
  const i = hit.sib.indexOf(hit.n);
  if (i < 0) return;
  const j = i + dir;
  if (j < 0 || j >= hit.sib.length) {
    say(hit.n.title + " is already at the " + (dir < 0 ? "top" : "bottom"));
    return;
  }
  hit.sib.splice(i, 1);
  hit.sib.splice(j, 0, hit.n);
  renderAll();
}

function cutSel() {
  if (!sel) return;
  const hit = find(sel);
  clip = hit ? hit.n : null;
  renderTree();
}
function takeClip() {
  if (!clip) { say("Cut something first"); return null; }
  const src = find(clip.id);
  if (!src) { clip = null; return null; }
  src.sib.splice(src.sib.indexOf(src.n), 1);
  const moved = src.n;
  clip = null;
  return moved;
}

function pasteAsRoom() {

}
function selectRoot() { sel = "__root__"; renderTree(); renderInsp(); }
function onDropRoot(ev) {
  ev.preventDefault();
  const srcId = ev.dataTransfer.getData("text/plain");
  if (!srcId) return;
  clip = find(srcId) && find(srcId).n;
  pasteAsRoom();
}

function pasteSel() {
  if (!clip) { say("Cut something first"); return; }
  if (sel === "__root__" || !sel) return pasteAsRoom();
  if (sel === clip.id) return;
  if (isDescendant(clip, sel)) { say("Cannot paste into its own child"); return; }
  const dest = find(sel);
  if (!dest) return pasteAsRoom();
  const moved = takeClip();
  if (!moved) return;
  dest.n.children = dest.n.children || [];
  dest.n.children.push(moved);
  sel = moved.id;
  openSet.add(dest.n.id);
  renderAll();
  say("Moved “" + moved.title + "” under “" + dest.n.title + "”");

function isDescendant(nodeObj, id) {

  walk(nodeObj.children || [], (n) => { if (n.id === id) found = true; });

function onDrag(ev, id) {

function applyParsed(obj) {

  }
  armedReset = false;
  try { localStorage.removeItem(KEY); } catch (e) {}
  tree = seed();
  sel = null; clip = null; emuPath = [];
  defaultOpen();
  renderAll();
  say("Reset to default architecture");
}

function exportTree() {
  const json = JSON.stringify(tree, null, 2);
  const blob = new Blob([json], { type: "application/json" });
  const name = "xcsoar-menu-tree.json";
  if (window.navigator && window.navigator.msSaveOrOpenBlob) {
    window.navigator.msSaveOrOpenBlob(blob, name);
    say("Saved " + name);
    return;
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  a.style.display = "none";
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    URL.revokeObjectURL(url);
    a.remove();
  }, 1000);
  say("Downloading " + name);
}

function importTree(ev) {
  const f = ev && ev.target && ev.target.files && ev.target.files[0];
  if (!f) { say("No file selected"); return; }
  const r = new FileReader();
  r.onload = () => {
    try { applyParsed(JSON.parse(r.result)); }
    catch (e) { say("Not a valid menu JSON file"); }
  };
  r.onerror = () => say("Could not read " + f.name);
  r.readAsText(f);
  ev.target.value = "";
}

function esc(s) {
  return String(s || "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}
function escAttr(s) { return esc(s).replace(/"/g, "&quot;"); }

window.resetTree = resetTree;
window.exportTree = exportTree;
window.importTree = importTree;

function toggleTree() {
  const on = !document.body.classList.contains("tree-on");
  document.body.classList.toggle("tree-on", on);
  const ex = document.getElementById("explorer");
  const btn = document.getElementById("btn-tree");
  if (ex) ex.style.display = on ? "flex" : "none";
  if (btn) btn.textContent = on ? "Hide tree" : "Reorganize";
  if (on) {
    renderTree();
    renderInsp();
  }
}
window.toggleTree = toggleTree;
document.getElementById("btn-reset").addEventListener("click", resetTree);
document.getElementById("btn-export").addEventListener("click", exportTree);
document.getElementById("imp").addEventListener("change", importTree);
window.addNode = addNode;
window.moveSel = moveSel;
window.cutSel = cutSel;
window.pasteSel = pasteSel;
window.pasteAsRoom = pasteAsRoom;
window.selectRoot = selectRoot;
window.onDropRoot = onDropRoot;
window.delSel = delSel;
window.selectNode = selectNode;
window.toggleOpen = toggleOpen;
window.editField = editField;
window.applyPreset = applyPreset;
window.editIconSvg = editIconSvg;
window.renameIcon = renameIcon;
window.onDrag = onDrag;
window.onOver = onOver;
window.onDrop = onDrop;
window.onLeave = onLeave;
window.openEmu = openEmu;
window.closeEmu = closeEmu;
window.emuBack = emuBack;
window.emuFlip = emuFlip;
window.toggleInsp = toggleInsp;
window.foldAll = foldAll;
renderAll();
</script>
